apiVersion: 1

datasources:
  - name: envmon-postgres
    uid: envmon-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    database: envmon
    user: envmon
    isDefault: true
    editable: false
    secureJsonData:
      password: $POSTGRES_PASSWORD
    jsonData:
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
